---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; max-width: 640px; margin: 70px auto; padding: 0 20px; color: #1a1a1a; background: #fff; }
  h1 { font-family: Helvetica, Arial, sans-serif; font-size: 1.7rem; font-weight: 700; margin-bottom: 2.4rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0.85rem 0; font-size: 0.95rem; }
  .date { font-style: italic; color: #8a8a8a; display: inline-block; min-width: 6.5em; }
  a { color: #0645ad; }
  footer { margin-top: 3.5rem; font-size: 0.85rem; color: #555; }
  footer p { margin: 0.2rem 0; }
</style>
</head>
<body>
<h1>{{ site.title }}</h1>
<ul>
  {% for post in site.posts %}
  <li><span class="date">{{ post.date | date: "%d.%m.%Y" }}</span><a href="{{ post.url }}">{{ post.title }}</a></li>
  {% endfor %}
</ul>
<footer>
  <p>Feel free to contact me :)</p>
  <p>{{ site.title }} | <a href="mailto:{{ site.email }}">email</a></p>
</footer>
</body>
</html>
